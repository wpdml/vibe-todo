<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 사이드바 -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">To-Do</h2>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="#" class="sidebar-link active" data-page="today">
                    <span class="sidebar-icon">☀️</span>
                    <span class="sidebar-text">오늘</span>
                </a>
            </li>
            <li>
                <a href="#" class="sidebar-link" data-page="week">
                    <span class="sidebar-icon">📅</span>
                    <span class="sidebar-text">이번 주</span>
                </a>
            </li>
            <li>
                <a href="#" class="sidebar-link" data-page="month">
                    <span class="sidebar-icon">🌙</span>
                    <span class="sidebar-text">이번 달</span>
                </a>
            </li>
            <li>
                <a href="#" class="sidebar-link" data-page="year">
                    <span class="sidebar-icon">🌍</span>
                    <span class="sidebar-text">올해</span>
                </a>
            </li>
        </ul>
        
        <!-- 커스텀 카테고리 섹션 -->
        <div class="custom-categories-section">
            <div class="custom-categories-header">
                <span class="custom-categories-title">내 카테고리</span>
                <button class="btn-add-category" id="addCategoryBtn" title="카테고리 추가">+</button>
            </div>
            <ul class="custom-categories-list" id="customCategoriesList">
                <!-- 커스텀 카테고리가 여기에 렌더링됩니다 -->
            </ul>
            <div class="category-actions">
                <button class="btn-edit-category" id="editCategoryBtn" title="카테고리 수정">✎</button>
            </div>
        </div>
        
        <div class="sidebar-footer">
            <p class="current-date" id="currentDate"></p>
        </div>
    </nav>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <div class="container">
            <header>
                <h1 id="pageTitle">오늘의 할일</h1>
                <p class="subtitle" id="pageSubtitle">오늘 해야 할 일을 기록하세요</p>
            </header>

            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="할일을 입력하세요..." 
                    autocomplete="off"
                >
                <button id="addBtn" class="btn-add">추가</button>
            </div>

            <div class="todo-stats">
                <span>전체: <strong id="totalCount">0</strong></span>
                <span>완료: <strong id="completedCount">0</strong></span>
                <span>미완료: <strong id="remainingCount">0</strong></span>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">전체</button>
                <button class="filter-btn" data-filter="active">미완료</button>
                <button class="filter-btn" data-filter="completed">완료</button>
            </div>

            <ul id="todoList" class="todo-list"></ul>

            <div id="emptyState" class="empty-state">
                <p>할일이 없습니다. 새로운 할일을 추가해보세요.</p>
            </div>
        </div>
    </main>

    <!-- 편집 모달 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>할일 수정</h2>
            <input 
                type="text" 
                id="editInput" 
                placeholder="수정할 내용을 입력하세요..."
                autocomplete="off"
            >
            <div class="modal-buttons">
                <button id="saveBtn" class="btn-save">저장</button>
                <button id="cancelBtn" class="btn-cancel">취소</button>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="modal">
        <div class="modal-content modal-delete">
            <span class="close" id="deleteCloseBtn">&times;</span>
            <h2>삭제 확인</h2>
            <p class="delete-message">이 할일을 삭제하시겠습니까?</p>
            <p class="delete-item-text" id="deleteItemText"></p>
            <div class="modal-buttons">
                <button id="confirmDeleteBtn" class="btn-delete-confirm">삭제</button>
                <button id="cancelDeleteBtn" class="btn-cancel">취소</button>
            </div>
        </div>
    </div>

    <!-- 카테고리 추가 모달 -->
    <div id="categoryModal" class="modal">
        <div class="modal-content modal-category">
            <span class="close" id="categoryCloseBtn">&times;</span>
            <h2>카테고리 추가</h2>
            <div class="category-form">
                <div class="form-group">
                    <label for="categoryName">카테고리 이름</label>
                    <input 
                        type="text" 
                        id="categoryName" 
                        placeholder="예: 운동, 공부, 프로젝트..."
                        autocomplete="off"
                    >
                </div>
                <div class="form-group">
                    <label>아이콘 선택</label>
                    <div class="emoji-picker" id="emojiPicker">
                        <button type="button" class="emoji-option selected" data-emoji="📁">📁</button>
                        <button type="button" class="emoji-option" data-emoji="💼">💼</button>
                        <button type="button" class="emoji-option" data-emoji="📚">📚</button>
                        <button type="button" class="emoji-option" data-emoji="💪">💪</button>
                        <button type="button" class="emoji-option" data-emoji="🎯">🎯</button>
                        <button type="button" class="emoji-option" data-emoji="🏠">🏠</button>
                        <button type="button" class="emoji-option" data-emoji="✈️">✈️</button>
                        <button type="button" class="emoji-option" data-emoji="🛒">🛒</button>
                        <button type="button" class="emoji-option" data-emoji="💡">💡</button>
                        <button type="button" class="emoji-option" data-emoji="🎨">🎨</button>
                        <button type="button" class="emoji-option" data-emoji="🎵">🎵</button>
                        <button type="button" class="emoji-option" data-emoji="❤️">❤️</button>
                        <button type="button" class="emoji-option" data-emoji="⭐">⭐</button>
                        <button type="button" class="emoji-option" data-emoji="🔥">🔥</button>
                        <button type="button" class="emoji-option" data-emoji="🌱">🌱</button>
                    </div>
                </div>
            </div>
            <div class="modal-buttons">
                <button id="saveCategoryBtn" class="btn-save">추가</button>
                <button id="cancelCategoryBtn" class="btn-cancel">취소</button>
            </div>
        </div>
    </div>

    <!-- 카테고리 삭제 모달 -->
    <div id="deleteCategoryModal" class="modal">
        <div class="modal-content modal-delete">
            <span class="close" id="deleteCategoryCloseBtn">&times;</span>
            <h2>카테고리 삭제</h2>
            <p class="delete-message">이 카테고리와 모든 할일을 삭제하시겠습니까?</p>
            <p class="delete-item-text" id="deleteCategoryName"></p>
            <div class="modal-buttons">
                <button id="confirmDeleteCategoryBtn" class="btn-delete-confirm">삭제</button>
                <button id="cancelDeleteCategoryBtn" class="btn-cancel">취소</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update, off } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

        // Firebase configuration - Netlify 환경 변수 사용
        const firebaseConfig = {
            apiKey: "AIzaSyD7vDaNrnnukE5NeLHEMj2IWf9lZIFNGQA",
            authDomain: "noona-todo-backend-86db8.firebaseapp.com",
            projectId: "noona-todo-backend-86db8",
            storageBucket: "noona-todo-backend-86db8.firebasestorage.app",
            messagingSenderId: "703741653354",
            appId: "1:703741653354:web:9d4713c6468318240a7513",
            databaseURL: "https://noona-todo-backend-86db8-default-rtdb.firebaseio.com",
        };

        // Netlify 환경 변수 지원 (배포 시 자동으로 교체)
        if (typeof process !== 'undefined' && process.env) {
            firebaseConfig.apiKey = process.env.VITE_FIREBASE_API_KEY || firebaseConfig.apiKey;
            firebaseConfig.authDomain = process.env.VITE_FIREBASE_AUTH_DOMAIN || firebaseConfig.authDomain;
            firebaseConfig.projectId = process.env.VITE_FIREBASE_PROJECT_ID || firebaseConfig.projectId;
            firebaseConfig.storageBucket = process.env.VITE_FIREBASE_STORAGE_BUCKET || firebaseConfig.storageBucket;
            firebaseConfig.messagingSenderId = process.env.VITE_FIREBASE_MESSAGING_SENDER_ID || firebaseConfig.messagingSenderId;
            firebaseConfig.appId = process.env.VITE_FIREBASE_APP_ID || firebaseConfig.appId;
            firebaseConfig.databaseURL = process.env.VITE_FIREBASE_DATABASE_URL || firebaseConfig.databaseURL;
        }

        try {
            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const database = getDatabase(app);

            // Make Firebase available globally
            window.firebaseApp = app;
            window.database = database;
            window.firebaseRefs = { ref, push, set, onValue, remove, update, off };

            console.log("✅ Firebase initialized successfully");
        } catch (error) {
            console.error("❌ Firebase 초기화 실패:", error);
            alert("Firebase 초기화에 실패했습니다. 콘솔을 확인해주세요.");
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
